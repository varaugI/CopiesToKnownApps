server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:streamflix_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  data:
    redis:
      host: localhost
      port: 6379

streamflix:
  storage:
    endpoint: http://localhost:9000
    bucket: streamflix-test-media
  security:
    jwt-secret: test_jwt_secret_key_for_junit_tests_streamflix_2026
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
